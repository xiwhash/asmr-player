<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#ffffff">
<title>需要密码</title>
<style>
:root{--bg:#fff;--bg2:#f7f8fa;--line:#e3e7ee;--txt:#161a21;--dim:#7a8494;--accent:#0f9d94;--err:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--txt);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.box{width:min(380px,100%);border:1px solid var(--line);border-radius:16px;padding:26px 22px;
  box-shadow:0 10px 40px rgba(16,24,40,.08);background:#fff}
h1{font-size:17px;font-weight:700;margin-bottom:4px}
.sub{font-size:12px;color:var(--dim);margin-bottom:20px}
input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--bg2)}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,157,148,.12);background:#fff}
button{width:100%;margin-top:12px;padding:12px;border:none;border-radius:10px;background:var(--accent);
  color:#fff;font-size:14px;font-weight:650;cursor:pointer}
button:hover{filter:brightness(1.06)}
button:disabled{opacity:.55;cursor:default}
.msg{margin-top:12px;font-size:12.5px;min-height:18px;color:var(--err)}
.remember{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--dim);cursor:pointer}
.remember input{width:15px;height:15px;padding:0;accent-color:var(--accent);background:none;border:none}
.foot{margin-top:16px;font-size:11px;color:var(--dim);line-height:1.7}
</style>
</head>
<body>
<div class="box">
  <h1>需要密码</h1>
  <div class="sub">此页面已加密，请输入解锁密码</div>
  <input id="pw" type="password" placeholder="密码" autocomplete="current-password" autofocus>
  <button id="go">解锁</button>
  <div class="msg" id="msg"></div>
  <label class="remember"><input type="checkbox" id="rem"><span>记住这台设备（下次免输）</span></label>
  <div class="foot">内容使用 AES-256-GCM 加密，密码不保存在页面里。忘记密码只能重新加密。</div>
</div>

  var KEY_REM = "asmr.pw.rem";

  function b64ToBytes(s){
    var bin = atob(s), n = bin.length, out = new Uint8Array(n);
    for (var i=0;i<n;i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function bytesToB64(bytes){
    var bin = "", chunk = 0x8000;
    for (var i=0;i<bytes.length;i+=chunk) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
    return btoa(bin);
  }

  async function tryDecrypt(pw){
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name:"PBKDF2", salt:b64ToBytes(SALT), iterations:ITER, hash:"SHA-256" },
      base, { name:"AES-GCM", length:256 }, false, ["decrypt"]
    );
    var plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64ToBytes(IV), tagLength:128 }, key, b64ToBytes(DATA));
    return new TextDecoder().decode(plain);
  }

  function mount(html){
    document.open(); document.write(html); document.close();
  }

  var pw = document.getElementById("pw"),
      go = document.getElementById("go"),
      msg = document.getElementById("msg"),
      rem = document.getElementById("rem");

  async function unlock(pwText, remember){
    go.disabled = true; msg.textContent = "";
    msg.style.color = "";
    msg.textContent = "解密中…";
    try {
      var html = await tryDecrypt(pwText);
      if (remember) { try { localStorage.setItem(KEY_REM, pwText); } catch(e){} }
      else { try { localStorage.removeItem(KEY_REM); } catch(e){} }
      msg.textContent = "";
      mount(html);
    } catch (e) {
      go.disabled = false;
      msg.style.color = "";
      msg.textContent = "密码错误";
      pw.select();
    }
  }

  go.onclick = function(){ unlock(pw.value, rem.checked); };
  pw.addEventListener("keydown", function(e){ if (e.key === "Enter") unlock(pw.value, rem.checked); });

  try {
    var saved = localStorage.getItem(KEY_REM);
    if (saved) { pw.value = saved; rem.checked = true; unlock(saved, true); }
  } catch (e) {}
})();
</script>
